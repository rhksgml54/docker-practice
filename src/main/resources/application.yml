server:
  port:8000

spring:
  application:
    name: demo-app
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true



logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-slevel [%thread] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never